name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # 3.9 = oldest Python commonly found on HPC login nodes.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - run: make lint
      - run: make docs

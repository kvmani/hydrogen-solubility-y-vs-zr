name: ci

# Manual only (owner's policy, 2026-11-23): CI never runs on push, pull request or a schedule.
# Start it from the Actions tab ("Run workflow") when asked or before a release; day to day, run
# the targeted checks listed in AGENTS.md locally.
on:
  workflow_dispatch:

jobs:
  tests:
    # 3.9 = oldest Python commonly found on HPC login nodes.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  lint-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r requirements-docs.txt
      - run: make lint
      - run: make docs

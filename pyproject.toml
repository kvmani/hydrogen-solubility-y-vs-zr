[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogen-solubility"
description = "Reproducible DFT (VASP) workflow comparing hydrogen solubility in alpha-Y and alpha-Zr"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["pyyaml>=6.0", "pydantic>=2.7"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hsol = "hydrogen_solubility.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hydrogen_solubility.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs/_build", "tools/presentation"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B905 (zip strict=) needs Python 3.10; the package supports 3.9 login nodes.
ignore = ["B905"]
